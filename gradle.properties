# Gradle 构建参数
#
# 这些设置影响本地与 CI 的构建行为。修改后请运行一次 `.\gradlew.bat check` 确认无回归。

# 并行执行互不依赖的模块任务。
org.gradle.parallel=true

# 复用任务输出缓存（本地与 CI 均可开启）。
org.gradle.caching=true

# 构建 JVM 内存。JavaFX 与 SpotBugs 同时运行时 2 GiB 较稳；如需更大可用
# GRADLE_OPTS 或命令行 `-Dorg.gradle.jvmargs=` 覆盖。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 依赖验证保持严格模式；不要在本地或 CI 关闭它（README 已明确要求）。
# 如需排查校验失败，使用 `--dependency-verification=lenient` 单次运行，
# 不要修改仓库配置。
#
# configuration cache 目前未启用：SpotBugs 与 jpackage 任务在 9.8.0 上仍有
# 兼容性告警（Configuration.setVisible 弃用），启用后可能产生难以定位的
# 构建失败。待升级插件后再评估。
# org.gradle.configuration-cache=true
version=1.0.2
