name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, for example V1.0.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ECL_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify
        run: .\gradlew.bat validateReleaseVersion "-PreleaseTag=$env:ECL_RELEASE_TAG" check --no-daemon

      - name: Package
        run: .\gradlew.bat packageWindowsApp --no-daemon

      - name: Archive app image
        shell: pwsh
        run: |
          $version = $env:ECL_RELEASE_TAG
          $archive = "ECL-$version-windows-x64.zip"
          Compress-Archive -Path dist/windows/ECL -DestinationPath $archive -CompressionLevel Optimal
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # TODO: pin this action to a commit SHA like the other workflows.
      # The repository otherwise pins every action by SHA; this one still uses a
      # major version tag because the matching SHA could not be verified offline.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          generate_release_notes: true
          files: ${{ env.RELEASE_ARCHIVE }}
