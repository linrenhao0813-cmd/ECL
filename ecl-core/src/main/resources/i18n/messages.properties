server.bundled.minesuperior.description = 经典生存服务器，含领地、经济、任务与排行榜系统。
server.bundled.earthmc.description = 1:500 比例的地球地图，可建立城镇与国家进行政治模拟。
server.bundled.craftadia.description = 休闲生存社区，提供商店、玩家市场与定期活动。
server.bundled.lemoncloud.description = 综合服务器网络，提供生存、空岛等多种模式。
server.bundled.purple-prison.description = 知名监狱经济 SMP 服务器，含挖矿、升级与交易玩法。
server.bundled.mccentral.description = 综合 SMP 网络，提供原版生存、Factions 与监狱等多种模式。
server.bundled.origin-realms.description = 高自定义内容 SMP，独特的资源包、生物与玩法。
server.bundled.foxcraft.description = 多模式 SMP 服务器，含生存、空岛与城镇。
server.bundled.togethercraft.description = 面向成年玩家的原版 SMP 社区，氛围友好。
server.bundled.minemen-club.description = 知名 PvP 练习服务器，提供各类竞技场、排位与练习模式。
server.bundled.pvp-legacy.description = 经典 PvP 服务器，主打多种 PvP 玩法与赛季排行。
server.bundled.lunar-network.description = Lunar Client 官方服务器，主打 PvP 与热门小游戏。
server.bundled.open-redstone-engineers.description = 公开的计算红石服务器，专注红石电路、逻辑门与自动化教学。
server.bundled.creativefun.description = 提供专用红石地块的创造服务器，适合搭建复杂电路与机关。
server.bundled.moxmc.description = 红石友好的创造与建造服务器，社区氛围活跃。
